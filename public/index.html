<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>web-tts</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 双层 Canvas：bg = 静态参考物（原点准星），fg = 棋子层按需重绘 -->
<canvas id="bg"></canvas>
<canvas id="fg"></canvas>

<div id="hud">
  <span id="hud-room">demo</span>
  <span class="sep">·</span>
  <span id="hud-conn" class="off">连接中</span>
  <span class="sep">·</span>
  <span id="hud-peers">1 人</span>
  <span class="sep">·</span>
  <span id="hud-seq">seq 0</span>
  <span class="sep">·</span>
  <span id="hud-pos">x 0.0  y 0.0</span>
  <span class="sep">·</span>
  <span id="hud-sel">未选中</span>
</div>

<div id="tools">
  <button id="btn-all" type="button">全选</button>
  <button id="btn-none" type="button">取消选择</button>
  <button id="btn-flipall" type="button">翻面</button>
  <button id="btn-origin" type="button">回原点</button>
  <button id="btn-fit" type="button">适配</button>
</div>

<script src="atlas.js"></script>
<script src="board.js"></script>
<script src="net.js"></script>
<script src="app.js"></script>
</body>
</html>
