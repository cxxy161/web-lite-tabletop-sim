<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>web-tts · 轻量级 2D 虚拟桌游</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f5f1e8'/%3E%3Crect x='7' y='7' width='18' height='18' rx='3' fill='none' stroke='%23c2703f' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="home">

<main id="home">

  <h1>轻量级 2D 虚拟桌游</h1>
  <p class="home-sub">自建自托管 · 免规则判定 · 老旧手机也能跑</p>

  <label class="field">
    <span>昵称</span>
    <input id="nick" type="text" maxlength="20" placeholder="给自己起个名字" autocomplete="nickname">
  </label>

  <div class="home-split">

    <section class="card">
      <h2>创建房间</h2>
      <p class="card-hint">建成后得到一个 6 位邀请码，发给朋友。</p>
      <label class="field">
        <span>房间名<span class="opt">（可留空）</span></span>
        <input id="roomname" type="text" maxlength="24" placeholder="例如：周三夜场">
      </label>
      <button id="btn-create" class="primary" type="button">创建并进入</button>
    </section>

    <section class="card">
      <h2>加入房间</h2>
      <p class="card-hint">输入朋友给你的邀请码。</p>
      <label class="field">
        <span>邀请码</span>
        <input id="code" type="text" maxlength="12" placeholder="例如 XK3F9Q"
               autocapitalize="characters" autocomplete="off" spellcheck="false">
      </label>
      <button id="btn-join" class="primary" type="button">加入</button>
    </section>

  </div>

  <p id="home-msg" class="home-msg"></p>

</main>

<script src="identity.js"></script>
<script src="home.js"></script>
</body>
</html>
