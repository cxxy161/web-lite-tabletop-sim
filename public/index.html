<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>web-tts · 大洋落日</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 双层 Canvas：bg = 原点准星，fg = 棋子层按需重绘 -->
<canvas id="bg"></canvas>
<canvas id="fg"></canvas>

<!-- 左上角统一面板：状态 + 工具 + 设置 -->
<div id="panel">

  <div id="hud">
    <span id="hud-room">demo</span>
    <span class="sep">·</span>
    <span id="hud-conn" class="off">连接中</span>
    <span class="sep">·</span>
    <span id="hud-peers">1 人</span>
    <span class="sep">·</span>
    <span id="hud-scene">—</span>
    <span class="sep">·</span>
    <span id="hud-seq">seq 0</span>
    <span class="sep">·</span>
    <span id="hud-sel">未选中</span>
    <span class="sep">·</span>
    <span id="hud-tex">贴图 0/0</span>
    <span class="sep">·</span>
    <span id="hud-pos">x 0.0  y 0.0</span>
  </div>

  <div id="tools">
    <button id="btn-all" type="button">全选</button>
    <button id="btn-none" type="button">取消</button>
    <button id="btn-marquee" type="button">框选</button>
    <button id="btn-flipall" type="button">翻面</button>
    <button id="btn-roll" type="button">掷骰</button>
    <button id="btn-origin" type="button">原点</button>
    <button id="btn-fit" type="button">适配</button>
    <button id="btn-saves" type="button">存档</button>
    <button id="btn-load" type="button">读档</button>
    <button id="btn-dice" type="button">加骰</button>
    <button id="btn-settings" type="button">设置</button>
  </div>

  <!-- 加骰：选面数 -->
  <div id="dice-bar" hidden>
    <span class="set-label">加骰子</span>
    <div id="dice-opts" class="set-seg"></div>
  </div>

  <div id="settings" hidden>
    <div class="set-row">
      <span class="set-label">画质</span>
      <div id="lod-levels" class="set-seg"></div>
    </div>
    <div id="lod-note" class="set-note"></div>

    <div class="set-row">
      <span class="set-label">盘面方向</span>
      <div id="map-modes" class="set-seg"></div>
    </div>
    <div id="map-note" class="set-note"></div>
  </div>

</div>

<!-- 棋子菜单（桌面右键 / 手机长按） -->
<div id="menu" hidden></div>

<div id="fatal" hidden></div>

<div id="saves" hidden>
  <div class="saves-head">
    <b>存档 / 读档</b>
    <button id="btn-close" type="button">关闭</button>
  </div>
  <p class="saves-hint">
    导出得到一串 base64 文本，复制走即可；读档把文本粘回来点「导入」。
    <b>不写文件</b>，纯剪贴板传递。
  </p>
  <textarea id="saves-text" spellcheck="false" placeholder="点「导出」生成存档，或在此粘贴存档后点「导入」"></textarea>
  <div class="saves-actions">
    <button id="btn-export" type="button">导出</button>
    <button id="btn-import" type="button">导入</button>
    <button id="btn-copy" type="button">复制</button>
    <span id="saves-msg"></span>
  </div>
</div>

<script src="board.js"></script>
<script src="texture.js"></script>
<script src="net.js"></script>
<script src="settings.js"></script>
<script src="dice.js"></script>
<script src="menu.js"></script>
<script src="saves.js"></script>
<script src="app.js"></script>
</body>
</html>
